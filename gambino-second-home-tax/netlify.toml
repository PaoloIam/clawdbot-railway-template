# Netlify configuration for the Gambino Group — Second Home Annual Tax site.
# This is a static site with NO build step.
#
# Two ways to deploy (see README.md):
#   A) Drag-and-drop this folder at https://app.netlify.com/drop
#   B) Connect the Git repo and set "Base directory" = gambino-second-home-tax
#      (publish below is relative to that base, so it stays ".")

[build]
  publish = "."
  command = ""

# Sensible security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
